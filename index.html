<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF 对比分析助手</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #f8f9fc;
    --card-bg: #fff;
    --text: #1a1d2b;
    --sub: #6b7280;
    --border: #e5e7eb;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --tag-bg: #eef2ff;
    --tag-text: #4f46e5;
    --error-bg: #fef2f2;
    --error-text: #dc2626;
    --success-bg: #f0fdf4;
    --success-text: #16a34a;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .container { max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }

  /* Header */
  .header { text-align: center; margin-bottom: 32px; }
  .header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .header p { color: var(--sub); font-size: 15px; margin-top: 6px; }

  /* Input Card */
  .input-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .input-row { display: flex; gap: 10px; }
  .input-row input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 16px;
    outline: none;
    transition: border-color .2s;
  }
  .input-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
  .input-row button {
    padding: 12px 28px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .2s, transform .1s;
  }
  .input-row button:hover:not(:disabled) { background: var(--accent-hover); }
  .input-row button:active:not(:disabled) { transform: scale(.97); }
  .input-row button:disabled { opacity: .5; cursor: not-allowed; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .tag {
    padding: 4px 12px;
    background: var(--tag-bg);
    color: var(--tag-text);
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: background .2s;
    border: none;
  }
  .tag:hover { background: #dde4ff; }

  /* Status */
  .status { margin-bottom: 24px; }
  .status-bar {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .status-loading { background: var(--tag-bg); color: var(--tag-text); }
  .status-error { background: var(--error-bg); color: var(--error-text); }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid #c7d2fe;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Result */
  .result-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 32px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
    line-height: 1.8;
  }
  .result-card h2 { font-size: 20px; margin: 24px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .result-card h3 { font-size: 17px; margin: 20px 0 8px; }
  .result-card h4 { font-size: 15px; margin: 16px 0 6px; }
  .result-card p { margin-bottom: 10px; }
  .result-card table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 14px; }
  .result-card th, .result-card td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  .result-card th { background: #f9fafb; font-weight: 600; }
  .result-card blockquote {
    border-left: 3px solid var(--accent);
    padding: 8px 16px;
    margin: 12px 0;
    background: var(--tag-bg);
    border-radius: 0 6px 6px 0;
    font-size: 14px;
  }
  .result-card ul, .result-card ol { padding-left: 24px; margin-bottom: 10px; }
  .result-card li { margin-bottom: 4px; }
  .result-card hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .result-card code {
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .result-card strong { color: var(--accent); }

  /* Footer */
  .footer {
    text-align: center;
    color: var(--sub);
    font-size: 13px;
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>
<div id="app">
  <div class="container">
    <div class="header">
      <h1>ETF 对比分析助手</h1>
      <p>输入 ETF 代码，对比基本面、实时行情与历史业绩</p>
    </div>

    <div class="input-card">
      <div class="input-row">
        <input
          v-model="codes"
          @keyup.enter="runCompare"
          placeholder="输入 ETF 代码，英文逗号分隔，最多 5 只"
          :disabled="loading"
        />
        <button @click="runCompare" :disabled="loading || !codes.trim()">
          {{ loading ? '分析中...' : '开始对比' }}
        </button>
      </div>
      <div class="tags">
        <button class="tag" @click="fill('510300,159915')" :disabled="loading">沪深300 + 创业板</button>
        <button class="tag" @click="fill('510300,510310')" :disabled="loading">两只沪深300ETF</button>
        <button class="tag" @click="fill('510050,510300,159915,588000')" :disabled="loading">四只主流ETF</button>
      </div>
    </div>

    <div v-if="loading" class="status">
      <div class="status-bar status-loading">
        <div class="spinner"></div>
        <span>正在获取对比数据，预计需要 5-20 秒...</span>
      </div>
    </div>

    <div v-if="error" class="status">
      <div class="status-bar status-error">{{ error }}</div>
    </div>

    <div v-if="resultHtml && !loading" class="result-card" v-html="resultHtml"></div>

    <div v-if="hasResult && !loading" class="footer">
      数据来源：新浪财经 / 东方财富公开数据，延迟约 15-30 分钟，仅供参考。不构成投资建议。
    </div>
  </div>
</div>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      codes: '',
      loading: false,
      error: '',
      resultHtml: '',
      hasResult: false,
    };
  },
  methods: {
    fill(s) { this.codes = s; },
    async runCompare() {
      const input = this.codes.trim();
      if (!input) return;

      this.loading = true;
      this.error = '';
      this.resultHtml = '';
      this.hasResult = false;

      try {
        const res = await fetch('/api/compare', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ codes: input }),
        });

        const data = await res.json();
        if (!res.ok || data.error) {
          this.error = data.error || '服务异常，请稍后重试';
          this.loading = false;
          return;
        }

        const raw = data.report || '暂无分析结果';
        // 清理 DeepSeek <think> 标签
        const cleaned = raw.replace(/<think[\s\S]*?<\/think>/g, '').trim();
        this.resultHtml = marked.parse(cleaned);
        this.hasResult = !!(cleaned);
      } catch (e) {
        this.error = '网络异常或服务超时，请稍后重试';
      } finally {
        this.loading = false;
      }
    },
  },
}).mount('#app');
</script>
</body>
</html>
