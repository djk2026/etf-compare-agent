    - data:
        code: "def main(codes: str) -> dict:\n    \"\"\"\n    清洗用户输入的 ETF 代码\n   \
          \ 1. 按逗号分割 2. 去空格 3. 去重 4. 校验6位数字 5. 最多5只\n    \"\"\"\n    if not codes\
          \ or not codes.strip():\n        return {\"cleaned_codes\": [], \"warning\"\
          : \"未输入ETF代码，请重新输入。例如：510300,159915\"}\n\n    raw = [c.strip() for c in\
          \ codes.split(\",\") if c.strip()]\n    seen = set()\n    valid = []\n\n\
          \    for c in raw:\n        if c in seen:\n            continue\n      \
          \  if len(c) == 6 and c.isdigit():\n            seen.add(c)\n          \
          \  valid.append(c)\n\n    warning_parts = []\n    invalid_count = len(raw)\
          \ - len(valid)\n    if invalid_count > 0:\n        warning_parts.append(f\"\
          {invalid_count}个代码无效，已过滤\")\n\n    if len(valid) > 5:\n        valid = valid[:5]\n\
          \        warning_parts.append(f\"代码超过5只，已截取前5只\")\n\n    warning = \"；\"\
          .join(warning_parts) if warning_parts else None\n\n    return {\"cleaned_codes\"\
          : valid, \"warning\": warning}"
        code_language: python3
