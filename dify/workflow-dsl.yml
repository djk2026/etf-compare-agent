    - data:
        code: "import json\n\n\ndef main(basic_body: str, snapshot_body: str, performance_body:\
          \ str,\n         cleaned_codes: list, warning: str) -> dict:\n    \"\"\"\
          \n    聚合 3 个 HTTP 节点的返回结果，构建结构化对比矩阵给 LLM\n    \"\"\"\n    # 1. 安全解析 JSON\n\
          \    def safe_parse(raw):\n        if not raw:\n            return {}\n\
          \        try:\n            return json.loads(raw) if isinstance(raw, str)\
          \ else raw\n        except (json.JSONDecodeError, TypeError):\n        \
          \    return {}\n\n    basic = safe_parse(basic_body)\n    snapshot = safe_parse(snapshot_body)\n\
          \    performance = safe_parse(performance_body)\n\n    # 2. 统计各维度成功率\n \
          \   basic_ok = sum(1 for c in cleaned_codes if basic.get(c) and not basic[c].get(\"\
          error\"))\n    snapshot_ok = sum(1 for c in cleaned_codes if snapshot.get(c)\
          \ and not snapshot[c].get(\"error\"))\n    perf_ok = sum(1 for c in cleaned_codes\
          \ if performance.get(c) and not performance[c].get(\"error\"))\n\n    total\
          \ = len(cleaned_codes)\n    basic_rate = basic_ok / total if total > 0 else\
          \ 0\n    snap_rate = snapshot_ok / total if total > 0 else 0\n    perf_rate\
          \ = perf_ok / total if total > 0 else 0\n\n    # 3. 全部失败 → 兜底\n    if basic_rate\
          \ == perf_rate == snap_rate == 0:\n        # 区分：代码全部无效 vs 服务不可用\n        all_invalid = all(\n\
          \            basic.get(c) and basic[c].get(\"error\") == \"invalid_code\"\n\
          \            for c in cleaned_codes\n        )\n        if all_invalid:\n\
          \            msg = f\"代码 {'、'.join(cleaned_codes)} 无效，请检查后重试。\"\n\
          \        else:\n            msg = \"当前数据服务暂不可用，请稍后重试。\"\n        return {\n            \"comparison_data\": \"\",\n            \"current_date\": \"\",\n            \"has_data\": \"false\"\n            ,\n            \"error_message\": msg\n        }\n\n    # 4. 逐只聚合\n    etfs = []\n   \
          \ for code in cleaned_codes:\n        b = basic.get(code, {}) or {}\n  \
          \      s = snapshot.get(code, {}) or {}\n        p = performance.get(code,\
          \ {}) or {}\n\n        etf = {\n            \"代码\": code,\n            \"\
          名称\": b.get(\"name\"),\n            \"基金公司\": b.get(\"management_company\"\
          ),\n            \"跟踪指数\": b.get(\"tracking_index\"),\n            \"行业分类\"\
          : b.get(\"industry\"),\n            \"基金规模\": b.get(\"fund_size\"),\n  \
          \          \"管理费率\": b.get(\"management_fee\"),\n            \"托管费率\": b.get(\"\
          custody_fee\"),\n            \"综合费率\": b.get(\"fee_rate\"),\n          \
          \  \"成立日期\": b.get(\"established_date\"),\n            \"最新价\": s.get(\"\
          price\"),\n            \"今日涨跌幅\": s.get(\"change_percent\"),\n         \
          \   \"今日成交额\": s.get(\"amount\"),\n            \"近1周收益\": p.get(\"returns\"\
          , {}).get(\"week1\") if p else None,\n            \"近1月收益\": p.get(\"returns\"\
          , {}).get(\"month1\") if p else None,\n            \"近3月收益\": p.get(\"returns\"\
          , {}).get(\"month3\") if p else None,\n            \"近6月收益\": p.get(\"returns\"\
          , {}).get(\"month6\") if p else None,\n            \"近1年收益\": p.get(\"returns\"\
          , {}).get(\"year1\") if p else None,\n            \"跟踪误差\": p.get(\"tracking_error\"\
          ) if p else None,\n        }\n        etfs.append(etf)\n\n    # 5. # 5. 构建 Markdown 对比表格（17 维度 × N 只 ETF，LLM 直接使用）\n\n    FIELD_ORDER = [\"跟踪指数\", \"基金公司\", \"成立日期\", \"行业分类\",\n                   \"跟踪误差\", \"管理费率\", \"托管费率\", \"综合费率\", \"基金规模\",\n                   \"最新价\", \"今日涨跌幅\", \"今日成交额\",\n                   \"近1周收益\", \"近1月收益\", \"近3月收益\", \"近6月收益\", \"近1年收益\"]\n\n    header_cols = [\"对比维度\"] + [f\"{etf.get('名称', '')}({etf.get('代码', '')})\" for etf in etfs]\n    lines = [\"## ETF 对比数据表格\\n\"]\n    lines.append(\"| \" + \" | \".join(header_cols) + \" |\")\n    lines.append(\"|\" + \"|\".join([\" :--- \"] * len(header_cols)) + \"|\")\n\n    for key in FIELD_ORDER:\n        row = [key]\n        for etf in etfs:\n            val = etf.get(key)\n            if val is None:\n                row.append(\"暂无数据\")\n            elif isinstance(val, float):\n                if key in (\"今日涨跌幅\", \"近1周收益\", \"近1月收益\", \"近3月收益\", \"近6月收益\", \"近1年收益\"):\n                    row.append(f\"{val*100:+.2f}%\")\n                elif key == \"基金规模\":\n                    row.append(f\"{val:.2f} 亿元\")\n                elif key == \"最新价\":\n                    row.append(f\"{val:.4f} 元\")\n                elif key == \"今日成交额\":\n                    if abs(val) >= 1e8:\n                        row.append(f\"{val/1e8:.2f} 亿元\")\n                    else:\n                        row.append(f\"{val:.0f} 元\")\n                elif key == \"跟踪误差\":\n                    row.append(f\"{val*100:.2f}%\")\n                else:\n                    row.append(f\"{val:.4f}\")\n            else:\n                row.append(str(val))\n        lines.append(\"| \" + \" | \".join(row) + \" |\")\n\n    lines.append(\"\")\n\n    # 5.5. 预计算费率差异（LLM 不再自行计算，减少 CoT 消耗）\n    fee_vals = []\n    for etf in etfs:\n        fee_str = etf.get(\"综合费率\")\n        if fee_str and isinstance(fee_str, str) and fee_str.endswith(\"%\"):\n            try:\n                fee_vals.append(float(fee_str[:-1]))\n            except ValueError:\n                fee_vals.append(None)\n        else:\n            fee_vals.append(None)\n    valid_fees = [f for f in fee_vals if f is not None]\n    if len(valid_fees) >= 2:\n        min_fee = min(valid_fees)\n        max_fee = max(valid_fees)\n        diff = max_fee - min_fee\n        if diff >= 0.1:\n            diff_5yr = diff * 5\n            lines.append(f\"\\n> 📊 费率差异：最高综合费率较最低高出 {diff:.1f} 个百分点，5 年累计持有成本多约 {diff_5yr:.1f} 个百分点（未计复利）。\")\n\n    # 6. 附加错误信息\n    error_parts = []\n    if basic_rate < 0.5:\n        error_parts.append(\"基本信息\")\n    if snap_rate < 0.5:\n        error_parts.append(\"实时行情\")\n    if perf_rate < 0.5:\n        error_parts.append(\"历史业绩\")\n\n    if error_parts:\n        lines.append(f\"---\\n> ⚠️ 以下维度数据暂不可用：{'、'.join(error_parts)}\")\n\n    from datetime import datetime\n    return {\n        \"comparison_data\": \"\\n\".join(lines),\n        \"current_date\": datetime.now().strftime(\"%Y 年 %m 月\"),\n        \"has_data\": \"true\",\n        \"error_message\": None\n    }"
        code_language: python3
        outputs:
          comparison_data:
            children: null
            type: string
          current_date:
            children: null
            type: string
          error_message:
            children: null
            type: string
          has_data:
            children: null
            type: string
        selected: false
        title: 数据聚合
        type: code
        variables:
