    - data:
        code: "import json\n\n\ndef main(basic_body: str, snapshot_body: str, performance_body:\
          \ str,\n         cleaned_codes: list, warning: str) -> dict:\n    \"\"\"\
          \n    聚合 3 个 HTTP 节点的返回结果，构建结构化对比矩阵给 LLM\n    \"\"\"\n    # 1. 安全解析 JSON\n\
          \    def safe_parse(raw):\n        if not raw:\n            return {}\n\
          \        try:\n            return json.loads(raw) if isinstance(raw, str)\
          \ else raw\n        except (json.JSONDecodeError, TypeError):\n        \
          \    return {}\n\n    basic = safe_parse(basic_body)\n    snapshot = safe_parse(snapshot_body)\n\
          \    performance = safe_parse(performance_body)\n\n    # 2. 统计各维度成功率\n \
          \   basic_ok = sum(1 for c in cleaned_codes if basic.get(c) and not basic[c].get(\"\
          error\"))\n    snapshot_ok = sum(1 for c in cleaned_codes if snapshot.get(c)\
          \ and not snapshot[c].get(\"error\"))\n    perf_ok = sum(1 for c in cleaned_codes\
          \ if performance.get(c) and not performance[c].get(\"error\"))\n\n    total\
          \ = len(cleaned_codes)\n    basic_rate = basic_ok / total if total > 0 else\
          \ 0\n    snap_rate = snapshot_ok / total if total > 0 else 0\n    perf_rate\
          \ = perf_ok / total if total > 0 else 0\n\n    # 3. 全部失败 → 兜底\n    if basic_rate\
          \ == perf_rate == snap_rate == 0:\n        return {\n            \"comparison_data\"\
          : \"\",\n            \"has_data\": \"false\",\n            \"error_message\"\
          : \"当前数据服务暂不可用，请稍后重试。\"\n        }\n\n    # 4. 逐只聚合\n    etfs = []\n   \
          \ for code in cleaned_codes:\n        b = basic.get(code, {}) or {}\n  \
          \      s = snapshot.get(code, {}) or {}\n        p = performance.get(code,\
          \ {}) or {}\n\n        etf = {\n            \"代码\": code,\n            \"\
          名称\": b.get(\"name\"),\n            \"基金公司\": b.get(\"management_company\"\
          ),\n            \"跟踪指数\": b.get(\"tracking_index\"),\n            \"行业分类\"\
          : b.get(\"industry\"),\n            \"基金规模\": b.get(\"fund_size\"),\n  \
          \          \"管理费率\": b.get(\"management_fee\"),\n            \"托管费率\": b.get(\"\
          custody_fee\"),\n            \"综合费率\": b.get(\"fee_rate\"),\n          \
          \  \"成立日期\": b.get(\"established_date\"),\n            \"最新价\": s.get(\"\
          price\"),\n            \"今日涨跌幅\": s.get(\"change_percent\"),\n         \
          \   \"今日成交额\": s.get(\"volume\"),\n            \"近1周收益\": p.get(\"returns\"\
          , {}).get(\"week1\") if p else None,\n            \"近1月收益\": p.get(\"returns\"\
          , {}).get(\"month1\") if p else None,\n            \"近3月收益\": p.get(\"returns\"\
          , {}).get(\"month3\") if p else None,\n            \"近6月收益\": p.get(\"returns\"\
          , {}).get(\"month6\") if p else None,\n            \"近1年收益\": p.get(\"returns\"\
          , {}).get(\"year1\") if p else None,\n            \"跟踪误差\": p.get(\"tracking_error\"\
          ) if p else None,\n        }\n        etfs.append(etf)\n\n    # 5. 构建简洁的结构化矩阵\n\
          \    lines = []\n    lines.append(\"## ETF 对比数据矩阵\\n\")\n    for etf in\
          \ etfs:\n        name = etf.get(\"名称\")\n        lines.append(f\"### {name}({etf['代码']})\"\
          )\n        for key in [\"跟踪指数\", \"基金公司\", \"成立日期\", \"行业分类\",\n       \
          \              \"跟踪误差\", \"管理费率\", \"托管费率\", \"综合费率\", \"基金规模\",\n     \
          \                \"最新价\", \"今日涨跌幅\", \"今日成交额\",\n                     \"\
          近1周收益\", \"近1月收益\", \"近3月收益\", \"近6月收益\", \"近1年收益\"]:\n            val =\
          \ etf.get(key)\n            if val is not None:\n                if isinstance(val,\
          \ float):\n                    # 区分数据语义：涨跌幅/收益率（有正负方向）vs 规模/价格/成交额（绝对值）\n\
          \                    if key in (\"今日涨跌幅\", \"近1周收益\", \"近1月收益\", \"近3月收益\"\
          , \"近6月收益\", \"近1年收益\"):\n                        val = f\"{val:+.4f}\"\n\
          \                    elif key == \"基金规模\":\n                        val\
          \ = f\"{val:.2f} 亿元\"\n                    elif key == \"最新价\":\n      \
          \                  val = f\"{val:.4f} 元\"\n                    elif key\
          \ == \"今日成交额\":\n                        if abs(val) >= 1e8:\n         \
          \                   val = f\"{val/1e8:.2f} 亿元\"\n                      \
          \  else:\n                            val = f\"{val:.0f} 元\"\n         \
          \           else:\n                        val = f\"{val:.4f}\"\n      \
          \          lines.append(f\"- {key}: {val}\")\n            else:\n      \
          \          lines.append(f\"- {key}: 暂无数据\")\n        lines.append(\"\")\n\
          \n    # 6. 附加错误信息\n    error_parts = []\n    if basic_rate < 0.5:\n    \
          \    error_parts.append(\"基本信息\")\n    if snap_rate < 0.5:\n        error_parts.append(\"\
          实时行情\")\n    if perf_rate < 0.5:\n        error_parts.append(\"历史业绩\")\n\
          \n    if error_parts:\n        lines.append(f\"---\\n> ⚠️ 以下维度数据暂不可用：{'、'.join(error_parts)}\"\
          )\n\n    return {\n        \"comparison_data\": \"\\n\".join(lines),\n \
          \       \"has_data\": \"true\",\n        \"error_message\": None\n    }"
        code_language: python3
        outputs:
          comparison_data:
            children: null
            type: string
          error_message:
            children: null
            type: string
          has_data:
            children: null
            type: string
